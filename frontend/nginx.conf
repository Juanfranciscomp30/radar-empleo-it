# Configuración de nginx para el frontend (plan 000 §4.1, ADR-0006).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: se reenvía al servicio "backend" de docker-compose (nunca localhost).
    # Sin barra final en proxy_pass para conservar la ruta /api/... completa.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: las rutas desconocidas devuelven index.html para que las resuelva Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
