# CI del proyecto (plan 000 §6, CA-7): compila y testea backend y frontend
# y comprueba que las imágenes Docker se construyen. Si un job falla, el workflow falla.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Incluye el test de integración con Testcontainers (el runner trae Docker).
      - name: Compilar y testear
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Misma versión de Node que la imagen del frontend (plan §4.1).
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npx ng test --watch=false

      - name: Build de producción
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docker-compose.yml interpola variables de .env; los valores de ejemplo bastan para construir.
      - name: Preparar .env de ejemplo
        run: cp .env.example .env

      - name: Construir imágenes
        run: docker compose build
