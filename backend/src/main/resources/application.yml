spring:
  application:
    name: radar-backend
  # Conexión a PostgreSQL: los valores llegan siempre por variables de entorno
  # (en Docker los pone docker-compose a partir de .env). Nunca se escriben aquí.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      # Flyway crea y evoluciona el esquema; Hibernate solo comprueba que las
      # entidades coinciden con él y, si no, la aplicación no arranca (ADR-0010, ADR-0011)
      ddl-auto: validate
    # Sin sesión de JPA abierta durante la vista: evita consultas ocultas desde los controladores
    open-in-view: false
  # Flyway aplica al arrancar las migraciones de src/main/resources/db/migration (ruta por defecto)

management:
  endpoints:
    web:
      # Endpoints de Actuator bajo /api -> el de salud queda en /api/health
      base-path: /api
      exposure:
        # Solo se expone "health"; ningún otro endpoint de Actuator es accesible por HTTP
        include: health
  endpoint:
    health:
      # Se ve el estado de cada componente (p. ej. "db": UP/DOWN)...
      show-components: always
      # ...pero no los detalles internos (versión de la BD, consultas, etc.)
      show-details: never
